name: Sync bookings and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Sync bookings from Google Calendar
        if: github.event_name != 'push'
        working-directory: scripts
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
        run: |
          npm install
          node sync-bookings.mjs

      - name: Commit updated bookings
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- frontend/src/bookedDates.json; then
            git add frontend/src/bookedDates.json
            git commit -m "Sync booked dates from Google Calendar"
            git push
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          PUBLIC_URL: /Siesta-Key-Gulf-Front-Escape-Beach-Rental
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/build
